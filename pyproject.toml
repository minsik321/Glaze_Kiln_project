[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln"
version = "0.7.0"
description = "유약 실험·소성 관리 시스템 — 계측·판단·제어·기록 사이클 (기획서 v7)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
backend = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
  # RAG(수정 사항 정리 3번) — Docker Qdrant + 로컬 fastembed 임베딩.
  # backend/app/vectorstore.py 참고. QDRANT_URL이 비어 있으면 RAG는
  # 조용히 꺼지므로, 이 의존성이 있어도 Qdrant를 안 띄우면 아무 영향 없다.
  "qdrant-client[fastembed]>=1.9,<2",
]
backend-dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pytest>=8",
  "pytest-asyncio>=0.24,<1",
  "uvicorn[standard]>=0.30,<1",
  "qdrant-client[fastembed]>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
