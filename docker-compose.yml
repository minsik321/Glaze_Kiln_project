# 이전 Qdrant 데이터를 복구하거나 backend/scripts/migrate_qdrant_once.py를
# 다시 실행할 때만 사용하는 보관용 서비스입니다. 현재 앱의 벡터 DB는
# Supabase pgvector이며 Docker는 실행에 필요하지 않습니다.
# docker compose --profile legacy-qdrant up -d 로 필요할 때만 시작합니다.
# 기존 볼륨은 삭제하지 않습니다.
services:
  qdrant:
    profiles: ["legacy-qdrant"]
    image: qdrant/qdrant:v1.12.4
    container_name: aice-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API + 대시보드(http://localhost:6333/dashboard)
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
